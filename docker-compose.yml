# Full production-like stack:  docker compose up --build
# then seed:                   docker compose exec api python scripts/seed_data.py --reset
services:
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql://claims:claims@postgres:5432/claims
      REDIS_URL: redis://redis:6379/0
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
      AUTH_ENABLED: "true"
      API_KEYS: "dev-admin-key:admin,dev-inv-key:investigator,dev-view-key:viewer"
    depends_on: [postgres, redis, neo4j]
    volumes: ["./data:/srv/data"]
  postgres:
    image: postgres:16
    environment: {POSTGRES_USER: claims, POSTGRES_PASSWORD: claims, POSTGRES_DB: claims}
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  neo4j:
    image: neo4j:5
    environment: {NEO4J_AUTH: neo4j/password}
    ports: ["7474:7474", "7687:7687"]
    volumes: ["neodata:/data"]
volumes: {pgdata: {}, neodata: {}}
